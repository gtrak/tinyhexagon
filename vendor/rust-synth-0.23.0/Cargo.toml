# Vendored by plan 002 issue 05b (th-synth): copy of the crates.io cache
# source (registry src index.crates.io, rust-synth 0.23.0, upstream git
# 12b25e0d881381ec7e5db60db239f98a4997894e; the registry extraction
# artifacts `.cargo-ok` / `.cargo_vcs_info.json` + the author's
# `Cargo.toml.orig` / `Cargo.lock` dropped). Changes vs the registry
# source:
#   * `[features]`: `default = []`; `tui` (ratatui + crossterm +
#     tracing-subscriber + `recording`) and `recording` (flacenc +
#     vorbis_rs + hound) gate the TUI/recording modules; the six
#     formerly-unconditional deps above became `optional`.
#   * `src/lib.rs`: `pub mod recording` / `pub mod tui` are
#     `#[cfg(feature = ...)]`-gated.
#   * `src/audio/engine.rs`: the 5 `RecorderState` touch points
#     (import, `EngineHandle.recorder` field, local, `start_stream`
#     param + call arg, per-frame `push_frame`) are
#     `#[cfg(feature = "recording")]`-gated.
#   * `src/audio/engine.rs` (plan 002 issue 09, the one-mixer plan): the
#     in-memory half — `AudioEngine::start_in_memory` (the same graph
#     build / GlobalParams / peaks / scope / phase clock as `start`,
#     `IN_MEMORY_SAMPLE_RATE` 48 kHz, no cpal stream: `EngineHandle`
#     `_stream` is `Option<Stream>`), `EngineHandle::render_stereo`
#     (the per-frame render the web's frame timer drives — peaks / scope
#     / phase clock update exactly the cpal callback's way; the callback
#     locals became the shared `RenderState` + `render_buffer` body, so
#     both halves render byte-for-byte the same) and the emscripten
#     `audio_context_state` / `replay_context` no-op on the `None`
#     stream (the in-memory engine's Web Audio context is the SFX device's
#     OpenAL one — the probe reads that context's state). `start` (the
#     cpal device stream) is unchanged in behavior; DSP/presets
#     (`src/audio/preset.rs`, `src/math`) still byte-identical.
#   * both `[[bin]]`s gained `required-features` so the TUI/render
#     binaries only build with their features.
#   * `src/audio/preset.rs` (plan 002 issue 11c, the FM kit): the first
#     deliberate change to the DSP/presets — the `PresetKind` enum grew
#     six append-only variants at the end (`FmKick, FmSnare, FmHat,
#     FmBass, FmLead, FmBell`; `ALL_KINDS` is now `[PresetKind; 14]`), a
#     shared `fm_voice` core (the YM2612/Sonic idiom: a sine carrier
#     whose phase is modulated by a second sine with a DECAYING
#     modulation index, in `bell_preset`'s shape: `(carrier_freq +
#     modulator * index) >> sine()`, `lfo` closures reading `Shared`
#     params, `freq_mod` for pitch, `follow(0.08)` after the frequency
#     closures, the `stereo_gate_voiced` tail), and the six voice
#     configs. Every FM voice step-gates its amplitude (and index)
#     envelope from `pattern_bits` via `rhythm::step_is_active`.
#     Everything else in `src/audio` / `src/math` is untouched.
#     `src/persistence.rs` + `src/tui/{life,formula,waveshape}.rs`: the
#     exhaustive matches over `PresetKind` grew with the six variants
#     (no behavior change).
#   * `src/audio/preset.rs` (plan 002 issue 11e, the wet-only reverb
#     fix — the SECOND deliberate DSP change, and a CORRECTNESS fix, not
#     a taste change): fundsp's `reverb_stereo(room, time, damping)` is
#     a WET-ONLY tank — it discards its dry input — yet every voice
#     piped its signal straight through it and used the tank's output
#     as the voice, so every instrument was 100% reverb tail and never
#     heard (measured: an impulse through it has no energy for the
#     first 2546 samples / 53 ms of predelay; pre-11e every soloed
#     voice's reverb tail was louder than the hit that caused it —
#     attack/tail median 0.58 across onsets where a punchy drum wants
#     5–20×). Each of the 9 affected voice sites (the 8 original
#     presets + the shared `fm_voice` core, i.e. all 14 `PresetKind`
#     voices) now re-adds the dry per fundsp's OWN doc idiom for
#     `reverb_stereo` — `multipass() & 0.2 * reverb_stereo(10.0, 5.0,
#     0.5)` ("Add 20% Reverb") — in the shape this file's own
#     `supermass_send` already used: `multipass::<U2>() & (wet_chain *
#     wet_amount)`, the existing effect chain (chorus/Haas → reverb)
#     kept intact in the wet branch. `reverb_mix` is now a true WET
#     AMOUNT in [0, 1] (0 = bone dry; pre-11e it was a whole-voice
#     level trim multiplying the wet-only signal — 0.0 meant SILENCE),
#     clamped to [0, 1] in `stereo_reverb_mix`, which now scales the
#     wet branch only (the LFO-REVERB modulation path unchanged, still
#     ±0.4 at depth=1). Every voice keeps its `stereo_gate_voiced`
#     tail (the 11a mute/solo fold), the FM core stays genuinely FM
#     (decaying index envelope untouched), no new dependencies, no
#     `PresetKind` changes. `supermass_send` itself was already correct
#     (`dry & wet_scaled`) and is untouched. See
#     .agents/tasks/plan-002/issue-011e-report.md for the measured
#     before/after and the re-balanced `reverb_mix` values (they live
#     in th-synth's `director.rs`, not here).
# Reason: the wasm32-unknown-emscripten cross-target spike (05b) —
# crossterm 0.28's mio does not support the emscripten target and
# vorbis_rs 0.5's ogg_next_sys build script needs a C compiler (emcc).
# `th-synth` uses only the `audio` + `math` modules, so it builds with
# the default (no-feature) configuration on every target. Wired by the
# root `[patch.crates-io] rust-synth` entry — see
# .agents/plans/002-tinyhexagon/05-synth.md and
# .agents/skills/lib-rust-synth.md ("wasm feature patch").

[package]
edition = "2021"
name = "rust-synth"
version = "0.23.0"
authors = ["Rustam <info@superduperai.co>"]
build = false
exclude = [
    "out/*",
    "dist/*",
    "recordings/*",
    "presets/*",
    "*.wav",
    "*.flac",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Terminal modular ambient synthesizer — FunDSP + Ratatui. Long cinematic pads, Euclidean drum sequencer, per-track LFO, Valhalla-Supermassive-style reverb, genetic evolution coupled to Conway's Game of Life, TOML presets, FLAC recording."
homepage = "https://github.com/fortunto2/rust-synth"
documentation = "https://docs.rs/rust-synth"
readme = "README.md"
keywords = [
    "synthesizer",
    "ambient",
    "dsp",
    "tui",
    "music",
]
categories = [
    "multimedia::audio",
    "command-line-utilities",
    "multimedia",
]
license = "MIT"
repository = "https://github.com/fortunto2/rust-synth"

# 05b feature gate (see the provenance block above): the TUI and the
# master-output recorder are OFF by default so `th-synth` (audio + math
# only) builds on every target without crossterm/mio or the
# flacenc/vorbis/hound recording stack. `persistence` stays
# unconditional (pure-Rust TOML preset I/O, builds on every target).
[features]
default = []
# Terminal UI (the `rust-synth` bin) + its recording controls.
tui = ["dep:ratatui", "dep:crossterm", "dep:tracing-subscriber", "recording"]
# Master-output recorder (FLAC/OGG encode + hound WAV) + the
# `rust-synth-render` bin.
recording = ["dep:flacenc", "dep:vorbis_rs", "dep:hound"]

[lib]
name = "rust_synth"
path = "src/lib.rs"

[[bin]]
name = "rust-synth"
path = "src/main.rs"
required-features = ["tui"]

[[bin]]
name = "rust-synth-render"
path = "cli/main.rs"
required-features = ["recording"]

[dependencies.anyhow]
version = "1"

[dependencies.chrono]
version = "0.4"

[dependencies.cpal]
version = "0.15"

[dependencies.crossterm]
version = "0.28"
optional = true

[dependencies.flacenc]
version = "0.5"
optional = true

[dependencies.fundsp]
version = "0.20"

[dependencies.hound]
version = "3.5"
optional = true

[dependencies.parking_lot]
version = "0.12"

[dependencies.ratatui]
version = "0.29"
optional = true

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.thiserror]
version = "2"

[dependencies.toml]
version = "0.8"

[dependencies.tracing]
version = "0.1"

[dependencies.tracing-subscriber]
version = "0.3"
features = ["env-filter"]
optional = true

[dependencies.vorbis_rs]
version = "0.5"
optional = true

[dev-dependencies.approx]
version = "0.5"

[dev-dependencies.tempfile]
version = "3"

[profile.profiling]
debug = 2
inherits = "release"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
