[package]
name = "th-game"
description = "Gameplay data types (walls, player, custom walls, status, ticker, timelines) ported from SSVOpenHexagon, with exact formulas/constants/float types"
version.workspace = true
edition.workspace = true

[dependencies]
th-math = { path = "../th-math" }
th-rng = { path = "../th-rng" }
th-data = { path = "../th-data" }
th-config = { path = "../th-config" }
th-assets = { path = "../th-assets" }

# Issue 009 composition/tests only — never a normal dependency (that would
# cycle: th-lua already depends on th-game). D-037: the Lua VM is Luau
# (th-lua's single `mlua/luau` build); th-game's test builds (the
# determinism harness runs Lua per frame) pick it up through th-lua's own
# dependency — no feature to forward.
[dev-dependencies]
th-lua = { path = "../th-lua" }

[features]
# D-023/D-024: mirror th-lua's `produce-lua-metadata` (the C++
# `SSVOH_PRODUCE_LUA_METADATA` build gate, `CMakeLists.txt`'s literal
# `if(FALSE)` = default OFF) for the engine's console tests: with the
# feature on, the `init_lua_and_print_docs_to` headless test sees the
# flag-ON metadata store (entry lines + resolved lookups); default builds
# see the shipped flag-OFF behavior (11 headers, zero entries,
# "UNKNOWN FUNCTION"). Forwarded onto the dev-dependency only — th-game
# itself gains no dependency (th-lua is already dev-only here, D-013).
produce-lua-metadata = ["th-lua/produce-lua-metadata"]
