[package]
name = "th-web"
description = "The emscripten (web) entry crate (plan 002): the tinyhexagon stub entry (wasm-bindgen status/save_session; the minimal page) — the real tiny runtime web entry lands in Issue 08"
version.workspace = true
edition.workspace = true

# The bin name is the ARTIFACT name (plan 002 issue 03): the emscripten
# build's outputs are tinyhexagon.js / tinyhexagon.wasm (the loader +
# wasm) + tinyhexagon.data (the preloaded _RELEASE tree) — the page and
# tools/package-web.sh stage those names.
[[bin]]
name = "tinyhexagon"
path = "src/main.rs"

# Issue 02a: the emscripten target dependencies (th-app / th-game /
# js-sys / web-sys — the adult W5 boot's stack) were removed with the
# stub; Issue 08 re-adds the real ones for the tiny runtime's web entry.
#
# Issue 03c: the stub now EXECUTES in the browser — its two probe
# exports (status / save_session, src/main.rs) need wasm-bindgen on the
# emscripten target. The version matches Cargo.lock (the CI installs the
# same wasm-bindgen-cli — the -sWASM_BINDGEN link flag makes emcc run
# the CLI over the linked wasm, so a version drift fails the build
# loudly, tools/package-web.sh's pre-check). Host-target builds stay
# dep-free (the cfg keeps the host workspace green without it).
[target.'cfg(target_os = "emscripten")'.dependencies]
wasm-bindgen = "0.2.129"
