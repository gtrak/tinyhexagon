[package]
name = "th-web"
description = "The tinyhexagon web (emscripten) entry (plan 002 issue 08a): the tiny runtime's browser boot over the preloaded _RELEASE MEMFS tree + the probe hooks (status / resumeAudio)"
version.workspace = true
edition.workspace = true

# The bin name is the ARTIFACT name (plan 002 issue 03): the emscripten
# build's outputs are tinyhexagon.js / tinyhexagon.wasm (the loader +
# wasm) + tinyhexagon.data (the preloaded _RELEASE tree) — the page and
# tools/package-web.sh stage those names. The emscripten build is
# ALWAYS `-p th-web` (tools/package-web.sh / build-wasm-emsdk.sh), so
# nothing else is compiled alongside it there.
#
# HOST-TARGET COLLISION (known P2, plan 002 issue 08c): this bin is ALSO
# built for host targets (the workspace gate compiles every crate's
# every target — the host main is the no-op above the deps), where it
# lands in the SAME output filename as `th-app`'s `tinyhexagon` bin
# (crates/th-app/src/bin/tinyhexagon.rs). `cargo build --workspace`
# (the host gate's stage 2) prints a NON-FATAL "output filename
# collision" warning for that pair and builds both (each under its own
# package: target/<...>/debug/deps/tinyhexagon-<th-app hash> vs
# tinyhexagon-<th-web hash>; the no-op host th-web bin shadows nothing
# because `cargo run` / `cargo build -p` pick their unit explicitly).
# The warning is EXPECTED on host builds — do not "fix" it by renaming
# this bin: the emscripten artifact names (tinyhexagon.js/.wasm/.data,
# the page's `import` + the release artifact's contents) are what the
# bin name buys, and the collision is a host-gate-only cosmetic.
[[bin]]
name = "tinyhexagon"
path = "src/main.rs"

# The emscripten target dependencies (issue 08a re-adds the real ones for
# the tiny runtime's web entry — the 03c stub's lone wasm-bindgen
# dependency becomes the stack's glue): `th-app` (the shared tiny entry
# + the `web_fullscreen` sinks), `th-game` (the browser-console log sink
# routing), `wasm-bindgen` / `web-sys` (the two probe exports
# + the log routing — the canvas / GL / input stay owned by the
# `th-render` emscripten layer's `Window`, which the tiny boot composes
# over). `JsValue` rides the `wasm-bindgen` prelude (the direct `js-sys`
# dep was unused — removed in fix 4). The versions match Cargo.lock (the CI installs the same
# wasm-bindgen-cli — the `-sWASM_BINDGEN` link flag makes emcc run the
# CLI over the linked wasm, so a version drift fails the build loudly,
# `tools/package-web.sh`'s pre-check). Host-target builds stay
# dep-free (the `cfg` keeps the host workspace green without them).
[target.'cfg(target_os = "emscripten")'.dependencies]
th-app = { path = "../th-app" }
th-game = { path = "../th-game" }
wasm-bindgen = "0.2.129"
web-sys = { version = "0.3.106", features = ["console"] }
