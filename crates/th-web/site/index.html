<html>
  <head>
    <meta charset="utf-8" />
    <!-- 09 touch fix: no page zoom (double-tap zoom cancels the game's
         touch), and the game owns every gesture. -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>tinyhexagon</title>
    <style>
      html, body { margin: 0; padding: 0; background: #111; color: #ddd;
                   font-family: monospace; overflow: hidden;
                   /* 09 touch fix: no pull-to-refresh / rubber-band — an
                      accidental drag must not take the page anywhere. */
                   overscroll-behavior: none; }
      /* Full-viewport: the emscripten window measures the real size at
         boot (the Gl backend's canvas backing store) — the attributes
         below are the pre-boot initial values only. */
      /* 09 touch fix (the drag-cancel bug): a POINTER event's
         preventDefault does NOT stop scrolling — only `touch-action`
         does. Without it, any small vertical drag on the canvas is the
         browser's pan/zoom gesture: the browser fires `pointercancel`
         (our feed folds it to TouchEnded) and the held rotation stops.
         `none` = the canvas owns every touch gesture. */
      canvas { display: block; width: 100vw; height: 100vh;
               touch-action: none; }
      /* 08a fix 4 (P2 #1) — visually hidden: the page is text-free, so
         the raw status line must not show to the child; the element
         stays in the DOM (the 1 s poll keeps filling its
         `textContent`, so `window.ohStatus()` + the probe's `#status`
         contract are unchanged). */
      #status { display: none; position: fixed; top: 4px; right: 8px;
                font-size: 11px; opacity: 0.7; z-index: 11; }
      /* 10b+11b — the score lab / DAW overlay (?scorelab=1 only): a
         semi-transparent panel OVER the running game (the game stays
         audible — the lab's point: hear the edit as it lands). The
         #scorelab element is created only by the module script's
         scorelab branch, so without the flag these rules are inert
         (the default page stays text-free and exactly as before).
         11b reshapes the panel FL-studio: the transport (bpm/gate/
         swing + the stage read + Clear solo + the status), the track
         rows (the header column — the role name, the M/S toggles,
         the instrument <select>, the gain slider — then the lane:
         the grouped drum rack, the bass/lead piano rolls, the

      #scorelab { position: fixed; top: 4px; left: 4px; z-index: 12;
                  max-width: min(96vw, 720px); max-height: 94vh; overflow: auto;
                  background: rgba(17, 17, 17, 0.88); border: 1px solid #3a3a3a;
                  padding: 8px 10px; font-size: 12px; line-height: 1.4;

      #scorelab .title { color: #888; margin: 2px 0; }
      #scorelab .row { display: flex; align-items: center; gap: 5px;

      #scorelab .lbl { display: inline-block; width: 42px; color: #999; }
      #scorelab input[type="range"] { width: 110px; }
      #scorelab .val { display: inline-block; width: 3.4em; color: #999; }
      #scorelab button { padding: 2px 8px; font-family: inherit; }
      #scorelab textarea { width: 100%; height: 88px; box-sizing: border-box;

        color: #bbb; border: 1px solid #444; margin-top: 3px; }
      #scorelab .jsonrow { display: block; margin-top: 4px; }
      #scorelab .status { display: inline-block; min-width: 160px; }
      #scorelab .stageread { color: #d8a017; font-size: 11px; }
      /* the track rows: the header column + the lane (the header

      #scorelab .msbtn.on-m { background: #7a1e1e; color: #fff;
                              border-color: #a04040; }
      #scorelab .msbtn.on-s { background: #7a5a1e; color: #fff;
                              border-color: #a0802f; }
      #scorelab .kindsel { max-width: 88px; font-size: 11px;

      #scorelab .gain input[type="range"] { width: 52px; }
      #scorelab .gain .val { width: 2.6em; }
      #scorelab .track.muted .lane { opacity: 0.35; }

      #scorelab .lane { flex: 1; min-width: 0; display: flex;
                        box-sizing: border-box; }
      #scorelab .gutter { width: var(--pitchw); flex: none; }
      /* the step columns: one 16-cell grid per row; the beat lines
         (every 4th column's left edge — the beats) run through the

      #scorelab .cells { display: grid;
                         grid-template-columns: repeat(16, var(--cellw));
                         grid-auto-rows: 1fr;
                         background-color: #0d1418;
                         background-image: repeating-linear-gradient(to right,
                           rgba(130, 170, 180, 0.22) 0 1px,
                           transparent 1px calc(4 * var(--cellw))); }
      #scorelab .cell { box-sizing: border-box; text-align: center;
                        font-size: 11px; color: #777; cursor: pointer;
                        user-select: none; border-right: 1px solid #162026; }
      #scorelab .cell.on { background: #1e7a46; color: #fff; }
      /* the drum rack: the ruler + the 3 rows read as ONE grouped
         block — no gaps between the rows, one continuous grid
         background, the beat lines the rack's full height */
      #scorelab .rackruler { display: flex; margin: 0; }
      #scorelab .rackruler .th { align-self: stretch; height: 15px;
                                 padding: 0 5px; line-height: 15px;
                                 font-size: 10px; color: #888; }
      #scorelab .rackruler .lane { height: 15px; border-bottom: 1px solid #2a3a40; }
      #scorelab .rackruler .cells { background-color: #10181c; }
      #scorelab .rackruler .cell { line-height: 14px; font-size: 10px;

      #scorelab .rackruler .cell.beat { color: #d8a017; font-weight: bold; }
      #scorelab .drumrow .cell { display: flex; align-items: center;

      #scorelab .drumrow + .drumrow .lane { border-top: 1px solid #1c262c; }
      #scorelab .rackend .lane { border-bottom: 1px solid #2a3a40; }

         octave rows ±12 marked distinctly), the note cells filled */
      #scorelab .lane.rollbass, #scorelab .lane.rolllead { display: block; }
      #scorelab .rollhead { font-size: 10px; color: #888; margin: 0 0 2px 0;

      #scorelab .rollrow { display: flex; align-items: center; }
      #scorelab .pth { width: var(--pitchw); flex: none; text-align: right;
                       padding-right: 4px; font-size: 9px; color: #666;
                       user-select: none; }
      #scorelab .pth.root { color: #6fb3e0; font-weight: bold; }
      #scorelab .pth.oct { color: #b06fd8; }
      #scorelab .rcells { display: grid;
                          grid-template-columns: repeat(16, var(--cellw));
                          background-color: #101010;
                          background-image: repeating-linear-gradient(to right,
                            rgba(130, 170, 180, 0.18) 0 1px,
                            transparent 1px calc(4 * var(--cellw))); }
      #scorelab .rcell { height: 15px; box-sizing: border-box;
                         border-right: 1px solid #191919;
                         border-bottom: 1px solid #191919;
                         cursor: pointer; }
      #scorelab .rcell.root { background: rgba(111, 179, 224, 0.07); }
      #scorelab .rcell.on { background: #2f7fb5; }
      #scorelab .rcell.on.root { background: #3d84c4; }
      /* the harmony lanes (pad/bell/sub): the read-only chord
         display (the schema has no per-step data for these — the
         engine ignores it; the bar chord is what they follow) */
      #scorelab .chordlane { display: block; font-size: 11px; color: #999;
                             padding: 5px 6px 5px calc(var(--pitchw) + 6px);
                             background: #101010; border: 1px solid #2c2c2c; }

  <body>
    <canvas id="c" width="640" height="480"></canvas>
    <!-- Starts EMPTY: the probe's wait is `#status` reaching
         `booted=true` (the poll below fills it every 1 s once the
         module resolves + the first frame lands). -->
    <div id="status"></div>
    <!-- 08a (fix 2) — the pinned wasm-bindgen 0.2.129 CLI's emscripten
         glue emits `new lAudioContext` (its vendor-prefixed alias for
         the native AudioContext) but emcc's JS-library merge drops the
         CLI's `const lAudioContext = ...` definition line, so the alias
         is bound here, before the module boots. Remove when the
         CLI/recipe is fixed (the pinned-CLI note in the 08a report). -->
    <script>
      // 09 diagnostic: capture EVERY AudioContext the page creates (the
      // OpenAL shim's context included — the module is ES-modularized so
      // its internal AL state is unreachable; the constructor wrap is
      // the only page-side window into it). The wrap happens BEFORE the
      // shim's lAudioContext alias binds, so the shim's contexts are
      // captured too. Purely observational.
      window.__ctxs = [];
      (() => {
        const Orig = window.AudioContext || window.webkitAudioContext;
        if (!Orig) return;
        const Wrapped = function (...a) {
          const c = new Orig(...a);
          try { window.__ctxs.push(c); } catch {}
          return c;
        };
        Wrapped.prototype = Orig.prototype;
        window.AudioContext = Wrapped;
        window.lAudioContext = Wrapped;
      })();
      window.lAudioContext = window.lAudioContext || window.AudioContext || window.webkitAudioContext;
      // 09 diagnostics (the one-mixer plan, issue 09): record the TRUE
      // content peak of every buffer the Web Audio graph starts — the
      // OpenAL scheduler's BufferSourceNodes (the SFX one-shots AND the
      // music streaming source's buffers, both on the ONE OpenAL
      // context). This separates "the graph renders silent buffers" from
      // "the buffers are loud but don't reach the speakers" — the
      // status/probe reads window.__audioStats. Purely observational
      // (no behavior change).
      window.__audioStats = { buffers: 0, maxPeak: 0.0, actx: "-", at: 0.0, adv: 0 };
      (() => {
        if (!window.AudioBufferSourceNode) return;
        const origStart = window.AudioBufferSourceNode.prototype.start;
        window.AudioBufferSourceNode.prototype.start = function (...args) {
          try {
            if (this.buffer) {
              window.__audioStats.buffers++;
              window.__audioStats.lastPeak = (() => { let m = 0; for (let i = 0; i < this.buffer.length; i += 16) { const a = Math.abs(this.buffer.getChannelData(0)[i]); if (a > m) m = a; } return m; })();
              for (let ch = 0; ch < this.buffer.numberOfChannels; ch++) {
                const d = this.buffer.getChannelData(ch);
                for (let i = 0; i < d.length; i += 8) {
                  const a = Math.abs(d[i]);
                  if (a > window.__audioStats.maxPeak) window.__audioStats.maxPeak = a;
                }
              }
            }
            // The REAL context's state + clock (the status's `ctx=` field
            // reads the device's throwaway probe context — this is the
            // one the buffers actually play in): the 09-silence test's
            // decisive observable. `adv` (did the clock advance since
            // the last poll) is computed by the status poll below.
            const c = this.context;
            window.__audioStats.actx = c.state;
            window.__audioStats.at = c.currentTime;
          } catch (err) { /* diagnostics only */ }
          return origStart.apply(this, args);
        };
      })();
    </script>
    <script type="module">
      // MODULARIZE + EXPORT_ES6 (the 26c.1 recipe): the default export
      // is the Module factory; it resolves once the wasm (the tiny
      // entry's `main` — `__wasm_call_ctors()` first, then the boot —
      // registered through wasm-bindgen's addOnInit) has initialized +
      // scheduled the first rAF frame (the 26c D-029 shape: the loop
      // self-owns; the browser owns the frames from here).
      import Module from "./tinyhexagon.js";
      const mod = await Module();
      // The probe hook (tools/web-tiny-probe.mjs's `window.ohStatus` —
      // the module scope's `mod` is not a global, so the page exposes
      // the `#[wasm_bindgen]` export on `window`).
      window.ohStatus = () => mod.status();
      // The one-mixer diagnostic: the module instance (the OpenAL shim's
      // live state — AL.currentCtx — hangs off it; the streaming tests
      // read the shim's own queues to pin the stall).
      window.ohMod = mod;
      // 10b — the score lab's per-second hook: the scorelab branch
      // (below) assigns it (the stage re-read + the first getScore
      // sync); null without ?scorelab=1, so the default page's poll
      // never calls it (its behaviour stays byte-identical).
      let scorelabTick = null;
      setInterval(() => {
        let s = mod.status();
        // The on-device buffer stats appended to the status line (the
        // diagnostic: `buffers=` the host's scheduled sources,
        // `bufPeak=` their true content peak — a loud bufPeak with
        // running ctx and still silence means the playback wiring, a
        // near-zero bufPeak means the graph renders silence there).
        try {
          const a = window.__audioStats;
          if (a) {
            // `adv`: the real context's clock ADVANCED since the last
            // poll (1 = the audio thread is actually rendering).
            a.adv = a.prevAt === undefined ? 0 : a.at > a.prevAt ? 1 : 0;
            a.prevAt = a.at;
            s += `;buffers=${a.buffers};bufPeak=${a.maxPeak.toFixed(4)};actx=${a.actx};adv=${a.adv};at=${a.at.toFixed(2)}`;
          }
        } catch { /* diagnostics only */ }
        document.getElementById("status").textContent = s;
        console.log("status " + s);
        // The unlock CONFIRMATION: the first poll that sees `audio=live`
        // (within 1 s of the gesture) logs the flip once.
        if (!audioLive && s.includes("audio=live")) {
          audioLive = true;
          console.log("[shell] audio unlocked (status poll)");
        }
        // 10b — the score lab's per-second hook (null without
        // ?scorelab=1): re-read the status line's stage= field (the
        // grid's drum rows track the CURRENT stage's effective tier)
        // and do the first getScore sync (getScore() is "" until the
        // boot's run installs the director).
        if (scorelabTick) scorelabTick(s);
      }, 1000);
      // plan 002 issue 08a — the FIRST-GESTURE audio unlock, hardened
      // in the 09 pass: EVERY pointerdown / keydown calls the exported
      // `resumeAudio()` until the status says `audio=live` (the export
      // is idempotent and cheap while live; the Rust side re-checks
      // the browser's user activation and arms the live synth engine).
      // A one-shot flag had a hole: a first gesture whose activation
      // check failed locked the page on the silent fallback forever
      // (the th-audio SFX device unlocks through emscripten's own
      // listeners — that's why SFX could work while the synth stayed
      // silent).
      let audioLive = false;
      let unlockLogged = false;
      const onGesture = (source) => {
        // THE REAL CONTEXT'S RESUME (the one-mixer's silence lesson): the
        // shim's own auto-resume listeners are `{ once: true }` — ONE
        // attempt ever, and on Chrome 155 the user measured 170 keydown
        // gestures with the real context still `suspended` (everything
        // scheduled on it inaudible). We own it now: EVERY gesture
        // resumes every context the page captured (idempotent while
        // running; a resume() inside a user gesture is always granted).
        try {
          for (const c of window.__ctxs || []) {
            if (c.state === "suspended") c.resume();
          }
        } catch (err) { /* diagnostics-grade */ }
        if (audioLive) return;
        try {
          // The unlock ATTEMPT (every gesture until live — the export is
          // idempotent): the flip itself is confirmed by the status poll
          // below, because the status's `audio=` static is written by the
          // NEXT rAF frame — reading it here (synchronously) sees the
          // pre-gesture value and would never log.
          mod.resumeAudio();
          if (!unlockLogged) {
            unlockLogged = true;
            console.log("[shell] audio unlock requested (" + source + "; retries silently until audio=live)");
          }
        } catch (err) {
          console.error("[shell] resumeAudio failed: " + err);
        }
      };
      window.addEventListener("pointerdown", () => onGesture("first pointerdown"));
      window.addEventListener("keydown", () => onGesture("first keydown"));
      // The 05a handoff's re-fire: a hidden tab freezes the
      // AudioContext's phase clock; returning to the tab re-arms
      // (the next gesture also re-tries — onGesture runs on every one).
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState !== "visible") return;
        onGesture("visibility -> visible");
      });

      // plan 002 issue 10b — the score lab: the `?scorelab=1` grid
      // overlay + the `?score=<url>` hot reload, over the issue-10a
      // exports (`getScore` = the engine's current score as canonical
      // pretty JSON; `setScore` = the in-place live swap — no graph
      // rebuild — returning "" or the human-facing error). Query-
      // gated: with neither flag in location.search this whole block
      // creates no DOM and does no fetches — the page behaves exactly
      // as before. The two compose (`?scorelab=1&score=<url>`: the
      // grid over the running game + the file's live reload); both
      // stay inert without their query string.
      const scoreParams = new URLSearchParams(location.search);
      const scorelab = scoreParams.get("scorelab") === "1";
      const scoreUrl = scoreParams.get("score");

      if (scorelab || scoreUrl) {
        // The lab's one state: the in-memory score (the engine's truth
        // — synced from getScore() at boot, after a rejected push, and
        // after a hot reload, so the panel always shows what the
        // engine is playing) + the last status line's stage + the
        // DAW's structure refs (scorelab-only; null without the flag).
        const lab = { score: null, stage: -1, statusEl: null, els: {}, daw: null, paintAll: null };

        // The setScore result's paint ("" = ok in green, the error in
        // red; the span exists only with the overlay — a no-op
        // otherwise).
        // The bake's copy path. `navigator.clipboard` is SECURE-CONTEXT
        // ONLY, so on a plain-http origin (the LAN/phone case: a
        // 192.168.x.x page is not secure) it is `undefined` and
        // writeText throws "Cannot read properties of undefined" — the
        // 10b bug. Fall back to the legacy execCommand path, which works
        // on insecure origins; if BOTH fail, hand the operator the JSON
        // box pre-selected instead of silently doing nothing.
        const copyText = async (text, box) => {
          if (window.isSecureContext && navigator.clipboard && navigator.clipboard.writeText) {
            try {
              await navigator.clipboard.writeText(text);
              return "";
            } catch (err) { /* fall through to the legacy path */ }
          }
          try {
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.append(ta);
            ta.select();
            const ok = document.execCommand("copy");
            ta.remove();
            if (ok) return "";
          } catch (err) { /* fall through */ }
          if (box) {
            box.focus();
            box.select();
          }
          return "clipboard blocked - the JSON box is selected, press Ctrl-C";
        };

        const paintScoreStatus = (err) => {
          if (!lab.statusEl) return;
          lab.statusEl.textContent = err === "" ? "ok" : err;
          lab.statusEl.style.color = err === "" ? "#4c4" : "#f55";
        };

        // Re-read the engine's truth (getScore() = the canonical pretty
        // JSON; "" until the boot's run installs the director — the 1 s
        // poll retries until it lands) and repaint the overlay from it.
        const syncFromEngine = () => {
          if (typeof mod.getScore !== "function") return;
          const text = mod.getScore();
          if (text === "") return; // pre-boot: the next poll retries
          try {
            lab.score = JSON.parse(text);
            if (scorelab && lab.paintAll) lab.paintAll();
          } catch (err) {
            console.error("[scorelab] getScore parse failed: " + err);
          }
        };

        // EVERY edit's exit: the caller mutated the in-memory score;
        // push it through the frozen export and paint the return.
        // A rejected push leaves the engine's score untouched — re-sync
        // so the UI never shows a change that didn't land.
        const pushScore = () => {
          if (typeof mod.setScore !== "function") {
            paintScoreStatus("setScore export missing (issue 10a not in this build)");
            return;
          }
          const err = mod.setScore(JSON.stringify(lab.score));
          paintScoreStatus(err);
          if (err !== "") {
            console.error("[scorelab] setScore rejected: " + err);
            syncFromEngine();
          }
        };

        // The ?score=<url> hot reload (the editor-driven loop): poll
        // the operator's file every 500 ms (they save
        // crates/th-synth/assets/score.json or a copy); when the text
        // changed, live-swap the engine's score. The outcome AND the
        // error log `[scorelab] reload: ...` to the console; errors
        // also paint the status span (when the overlay exists). An
        // UNAPPLIED text (a parse error, or the pre-boot "no
        // director") is retried on the next poll: lastText only
        // advances when the engine accepted the text.
        if (scoreUrl) {
          let lastText = "";
          (async () => {
            while (true) {
              let msg = null; // null: this poll has nothing to report
              let errText = "";
              try {
                const res = await fetch(scoreUrl, { cache: "no-store" });
                if (res.ok) {
                  const text = await res.text();
                  if (text !== lastText) {
                    const err = mod.setScore(text);
                    if (err === "") {
                      lastText = text; // applied: track it
                      msg = "ok";
                    } else {
                      msg = "error: " + err; // retry the same text next poll
                    }
                    errText = err;
                  }
                } else {
                  msg = "error: http " + res.status;
                  errText = "http " + res.status;
                }
              } catch (err) {
                msg = "error: " + (err && err.message ? err.message : String(err));
                errText = err && err.message ? err.message : String(err);
              }
              if (msg !== null) {
                (msg === "ok" ? console.log : console.error)("[scorelab] reload: " + msg);
                if (msg === "ok") {
                  paintScoreStatus("");
                  syncFromEngine(); // the panel tracks the new truth
                } else {
                  paintScoreStatus("reload: " + errText);
                }
              }
              await new Promise((r) => setTimeout(r, 500));
            }
          })();
        }

        if (scorelab) {
          // ---- the DAW overlay (11b): built ONLY here (the default
          // page's DOM has no trace of it) — a fixed, semi-transparent
          // panel over the canvas; the game keeps running and audible
          // behind it. The FL-studio shape the operator asked for:
          // the transport row (bpm/gate/swing + the stage read +
          // Clear solo + the status), then the track rows — a header
          // per slot (the ROLE name, the M/S toggles, the instrument
          // <select> over ALL_KIND_IDS, the gain slider) and the
          // lane: the 3 drum rows + the shared step ruler grouped as
          // ONE rack, the bass/lead PIANO ROLLS (Y = pitch, X = step;
          // click sets the pitch, the note's own cell clears to rest,
          // drag draws across steps), and the read-only chord display
          // for pad/bell/sub. Every edit pushes through the
          // issue-10a exports (pushScore); the panel's source is
          // mod.getScore() (the truth the engine is playing).
          const mk = (tag, text, cls) => {
            const e = document.createElement(tag);
            if (text !== undefined) e.textContent = text;
            if (cls) e.className = cls;
            return e;
          };

          const panel = mk("div");
          panel.id = "scorelab";

          // The title (the #status line is hidden by the text-free
          // design — the transport's stage read is the operator's
          // other view of the current tier).
          const titleEl = mk("div", "score lab — daw", "title");
          lab.els.title = titleEl;

          // The 8 slots (engine/director::SLOTS order): the ROLE
          // (fixed by the index — the driver that sequences the slot:
          // the drum tiers, the bass/lead lines, the bar chord) + the
          // BUILT-IN kind (the timbre when the score leaves
          // slots[i].kind absent — issue-10 scores and the shipped
          // bake) + the lane's kind. KIND_IDS must match th-synth's
          // ALL_KIND_IDS exactly (the probe pins the select ->
          // getScore round trip); CHORD_RATIO mirrors
          // director::SLOTS[5..7].ratio (display-only — the ratios
          // are engine constants, not score data).
          const SLOTS_META = [
            { name: "KICK", builtin: "heartbeat", lane: "drum" },
            { name: "SNARE", builtin: "heartbeat", lane: "drum" },
            { name: "HAT", builtin: "heartbeat", lane: "drum" },
            { name: "BASS", builtin: "bass_pulse", lane: "roll" },
            { name: "LEAD", builtin: "pluck_saw", lane: "roll" },
            { name: "PAD", builtin: "pad_zimmer", lane: "chord" },
            { name: "BELL", builtin: "bell", lane: "chord" },
            { name: "SUB", builtin: "drone_sub", lane: "chord" },
          ];
          const KIND_IDS = [
            "pad_zimmer", "bass_pulse", "heartbeat", "drone_sub",
            "shimmer", "bell", "super_saw", "pluck_saw",
            "fm_kick", "fm_snare", "fm_hat", "fm_bass",
            "fm_lead", "fm_bell",
          ];
          const CHORD_RATIO = [1.0, 2.0, 0.25];

          // The transport row: the stage read (the drum rack shows the
          // CURRENT stage's effective tier — re-read from the status
          // line by the 1 s poll), the BPM slider (score.bpm.base —
          // the ramp's per_stage/cap stay untouched) + the
          // gate_open/swing pair (10b), the Clear-solo escape hatch
          // (a baked solo would silence every non-soloed slot — the
          // game goes quiet), and the setScore status span.
          const transport = mk("div", null, "row");
          const slider = (label, min, max, step, onInput) => {
            const s = mk("input");
            s.type = "range"; s.min = String(min); s.max = String(max);
            s.step = String(step); s.value = "0";
            const fmt = (v) => v.toFixed(step < 1 ? 2 : 0);
            const read = mk("span", "0", "val");
            s.addEventListener("input", () => {
              const v = Number(s.value);
              read.textContent = fmt(v);
              if (lab.score) onInput(v);
            });
            transport.append(mk("span", label, "lbl"), s, read);
            return { input: s, read, fmt };
          };
          lab.els.bpm = slider("bpm", 60, 220, 1, (v) => { lab.score.bpm.base = v; pushScore(); });
          lab.els.gate = slider("gate", 0, 1, 0.01, (v) => { lab.score.gate_open = v; pushScore(); });
          // swing's sensible range is 0..0.5 (the shipped score's 0.15
          // leaves headroom; the schema itself takes any non-negative
          // fraction).
          lab.els.swing = slider("swing", 0, 0.5, 0.01, (v) => { lab.score.swing = v; pushScore(); });
          const stageRead = mk("span", "stage ?", "stageread");
          stageRead.id = "scorelab-stage";
          transport.append(stageRead);
          const clearSoloBtn = mk("button", "Clear solo");
          clearSoloBtn.id = "scorelab-clear-solo";
          clearSoloBtn.title = "score.solo = null — the explicit escape hatch (a baked solo silences the game)";
          clearSoloBtn.addEventListener("click", () => {
            if (!lab.score) return;
            lab.score.solo = null;
            pushScore();
            paintMix();
          });
          transport.append(clearSoloBtn);
          lab.statusEl = mk("span", "", "status");
          lab.statusEl.id = "scorelab-status";
          transport.append(lab.statusEl);

          // The track rows: one per slot. The header (the role name,
          // M, S, the instrument <select>, the gain slider — the 10b
          // gain row's slider moved INTO the header: one control set
          // per slot). The lane's content is built by buildDrumDom /
          // buildRoll (the structure rebuilds only when steps_per_bar
          // or a roll's pitch range changes).
          const tracks = mk("div", null, "tracks");
          const trackEls = [];
          for (let i = 0; i < 8; i++) {
            const meta = SLOTS_META[i];
            const root = mk("div", null,
              "track" + (i < 3 ? " drumrow" : "") + (i === 2 ? " rackend" : "")
              + (i === 3 || i === 5 ? " gap" : ""));
            root.id = "scorelab-track-" + i;
            const th = mk("div", null, "th");
            th.append(mk("span", meta.name, "tname"));
            const mBtn = mk("button", "M", "msbtn");
            mBtn.id = "scorelab-mute-" + i;
            mBtn.title = "mute: slots[" + i + "].muted (the row dims while muted)";
            mBtn.addEventListener("click", () => {
              if (!lab.score) return;
              lab.score.slots[i].muted = !lab.score.slots[i].muted;
              pushScore();
              paintMix();
            });
            const sBtn = mk("button", "S", "msbtn");
            sBtn.id = "scorelab-solo-" + i;
            sBtn.title = "solo: score.solo = " + i + " (click again — or Clear solo — to clear)";
            sBtn.addEventListener("click", () => {
              if (!lab.score) return;
              lab.score.solo = lab.score.solo === i ? null : i;
              pushScore();
              paintMix();
            });
            const sel = mk("select", null, "kindsel");
            sel.id = "scorelab-kind-" + i;
            sel.title = "instrument: the TIMBRE only — the role (and its driver) stays";
            for (const id of KIND_IDS) {
              const o = mk("option", id);
              o.value = id;
              sel.append(o);
            }
            sel.addEventListener("change", () => {
              if (!lab.score) return;
              lab.score.slots[i].kind = sel.value;
              pushScore();
              paintMix();
            });
            const gainWrap = mk("span", null, "gain");
            const gain = mk("input");
            gain.type = "range"; gain.min = "0"; gain.max = "1"; gain.step = "0.01";
            gain.title = "slots[" + i + "].gain";
            const gainRead = mk("span", "", "val");
            gain.addEventListener("input", () => {
              if (!lab.score) return;
              const v = Number(gain.value);
              gainRead.textContent = v.toFixed(2);
              lab.score.slots[i].gain = v;
              pushScore();
            });
            gainWrap.append(gain, gainRead);
            th.append(mBtn, sBtn, sel, gainWrap);
            const lane = mk("div", null,
              "lane" + (meta.lane === "drum" ? " drumlane" : meta.lane === "chord" ? " chordlane" : ""));
            root.append(th, lane);
            tracks.append(root);
            trackEls.push({ root, mBtn, sBtn, sel, gain, gainRead, lane });
          }

          // The shared step ruler (the drum rack's top edge): the
          // step numbers 1..16 (the beats — every 4th — emphasized),
          // on the rack's grid background, so the ruler + the 3 rows
          // read as ONE grouped block.
          const ruler = mk("div", null, "rackruler");
          ruler.append(mk("div", "step", "th"), mk("div", null, "lane drumlane"));
          tracks.prepend(ruler);

          // The director's tier resolution (the 10b logic, unchanged):
          // the last tier with `stage <= stage` (the tiers ascend; a
          // valid score's tiers[0].stage is 0, so this always
          // resolves).
          const tierAtOrBelow = (tiered, stage) => {
            let best = null;
            for (const t of tiered.tiers) if (t.stage <= stage) best = t;
            return best;
          };
          const stageNow = () => (lab.stage < 0 ? 0 : lab.stage);

          // The piano-roll drag state (the FL basic interaction): a
          // mousedown sets the cell's pitch at its step; dragging
          // across steps with the button held writes the SAME pitch
          // to each step passed over (the mouseenter-while-down
          // pattern; the mouseup on window ends it). null = not
          // painting.
          let rollDrag = null;
          window.addEventListener("touchend", () => { rollDrag = null; });

          // A roll cell's write: clicking sets that pitch at the step
          // (notes[i] = the offset); clicking the note's OWN cell
          // again clears it to rest (null). This REPLACES the 10b
          // palette-cycle — the grid IS the pitch picker now.
          const setRollNote = (line, pitch, step) => {
            if (!lab.score) return;
            const notes = lab.score[line].notes;
            if (step < 0 || step >= notes.length) return;
            notes[step] = notes[step] === pitch ? null : pitch;
          };
          const paintRollCell = (line, pitch, step) => {
            setRollNote(line, pitch, step);
            pushScore();
            paintRolls();
          };
          const startRollPaint = (line, pitch, step) => {
            rollDrag = { line, pitch };
            paintRollCell(line, pitch, step);
            const up = () => {
              rollDrag = null;
              window.removeEventListener("mouseup", up);
            };
            window.addEventListener("mouseup", up);
          };

          // The pitch range: the union of the line's notes + its root
          // (offset 0), padded one octave either way — a typical line
          // is fully visible. The rows are labelled with the
          // semitone offset (the schema's value); the root row (0)
          // and the octave rows (±12) are marked distinctly.
          // The roll's visible pitch span: the notes' own range rounded
          // OUT to octave boundaries. The spec's "pad one octave either
          // way" produced a 37-row grid for a line that uses 10 notes
          // (the bass reached -12..+24), which buried the LEAD roll
          // below a screen of empty rows. Rounding to octaves keeps the
          // grid compact AND every visible row musically meaningful
          // (a pitch you can actually hear a relation to).
          const pitchRange = (line) => {
            let lo = 0, hi = 0;
            for (const n of lab.score[line].notes) {
              if (n !== null) {
                if (n < lo) lo = n;
                if (n > hi) hi = n;
              }
            }
            const floorOct = (v) => Math.floor(v / 12) * 12;
            const ceilOct = (v) => Math.ceil(v / 12) * 12;
            const outLo = floorOct(lo);
            let outHi = ceilOct(hi);
            if (outHi - outLo < 12) outHi = outLo + 12; // at least one octave
            return [outLo, outHi];
          };

          // Build one roll's DOM into the track's lane: the header
          // note (the octave_shift readout + the chord-following
          // note — the bass follows the bar's chord, the lead does
          // not) + the pitch rows (Y = pitch, X = step).
          const buildRoll = (line) => {
            const lane = trackEls[line === "bass" ? 3 : 4].lane;
            lane.classList.add(line === "bass" ? "rollbass" : "rolllead");
            lane.id = "scorelab-roll-" + line;
            lane.replaceChildren();
            lane.append(mk("div",
              line === "bass"
                ? "octave " + lab.score.bass.octave_shift + " — the bass follows the bar's chord"
                : "octave " + lab.score.lead.octave_shift + " — the lead stays on the key root (ignores the chord)",
              "rollhead"));
            const [lo, hi] = pitchRange(line);
            const rows = [];
            for (let p = lo; p <= hi; p++) {
              const rowEl = mk("div", null, "rollrow");
              const pth = mk("span", p > 0 ? "+" + p : String(p), "pth"
                + (p === 0 ? " root" : p % 12 === 0 ? " oct" : ""));
              const cells = mk("div", null, "rcells");
              const stepCells = [];
              for (let s = 0; s < lab.score.steps_per_bar; s++) {
                const c = mk("div", null, "rcell" + (p === 0 ? " root" : ""));
                c.dataset.line = line;
                c.dataset.pitch = String(p);
                c.dataset.step = String(s);
                c.addEventListener("mousedown", (e) => {
                  e.preventDefault(); // no text selection while painting
                  startRollPaint(line, p, s);
                });
                c.addEventListener("mouseenter", (e) => {
                  // The drag-to-draw: entering a cell while painting
                  // (a button held) writes the SAME pitch.
                  if (rollDrag && rollDrag.line === line && (e.buttons & 1)) {
                    paintRollCell(line, p, s);
                  }
                });
                // Touch (optional but preferred): resolve the cell
                // under the finger.
                c.addEventListener("touchstart", (e) => {
                  e.preventDefault();
                  startRollPaint(line, p, s);
                }, { passive: false });
                c.addEventListener("touchmove", (e) => {
                  e.preventDefault();
                  const t = e.touches[0];
                  if (!t) return;
                  const el = document.elementFromPoint(t.clientX, t.clientY);
                  if (el && el.classList.contains("rcell") && el.dataset.line === line) {
                    paintRollCell(line, Number(el.dataset.pitch), Number(el.dataset.step));
                  }
                }, { passive: false });
                cells.append(c);
                stepCells.push(c);
              }
              rowEl.append(pth, cells);
              lane.append(rowEl);
              rows.push(stepCells);
            }
            lab.daw.rolls[line] = { lo, hi, steps: lab.score.steps_per_bar, rows };
          };

          // The rolls' cell repaint (no DOM rebuild — the cells are
          // built once per pitch range; moving a note only flips the
          // on/off class).
          const paintRolls = () => {
            if (!lab.score || !lab.daw) return;
            for (const line of ["bass", "lead"]) {
              const r = lab.daw.rolls[line];
              if (!r) continue;
              const notes = lab.score[line].notes;
              r.rows.forEach((cells, ri) => {
                const p = r.lo + ri;
                cells.forEach((c, s) => {
                  c.classList.toggle("on", s < notes.length && notes[s] === p);
                });
              });
            }
          };

          // The drum rack's DOM (rebuilds only when steps_per_bar
          // changes): the ruler's step cells + the 3 rows' cells. The
          // rows share the rack's grid background + beat lines and
          // sit adjacent (no gaps between the rows) — one block.
          const buildDrumDom = (steps) => {
            const rulerCells = mk("div", null, "cells");
            for (let i = 0; i < steps; i++) {
              rulerCells.append(mk("span", String(i + 1),
                "cell" + (i % 4 === 0 ? " beat" : "")));
            }
            ruler.children[1].replaceChildren(mk("div", null, "gutter"), rulerCells);
            const drumCells = {};
            for (let i = 0; i < 3; i++) {
              const drum = ["kick", "snare", "hat"][i];
              const lane = trackEls[i].lane;
              const row = mk("div", null, "cells");
              const cells = [];
              for (let s = 0; s < steps; s++) {
                const c = mk("span", null, "cell");
                c.addEventListener("click", () => toggleDrum(drum, s));
                cells.push(c);
                row.append(c);
              }
              lane.replaceChildren(mk("div", null, "gutter"), row);
              drumCells[drum] = cells;
            }
            return drumCells;
          };

          // The drum rows' repaint: the CURRENT stage's effective
          // tier (the hit chars minus the tier's `exclude` — the
          // engine's rule).
          const paintDrums = () => {
            if (!lab.daw || !lab.score) return;
            const stage = stageNow();
            for (const drum of ["kick", "snare", "hat"]) {
              const tier = tierAtOrBelow(lab.score[drum], stage);
              const pattern = tier ? tier.pattern : ".".repeat(lab.daw.steps);
              const exclude = tier && tier.exclude ? tier.exclude : [];
              lab.daw.drumCells[drum].forEach((cell, i) => {
                // The EFFECTIVE state: a hit char, unless the tier's
                // `exclude` forces the step off (the engine's rule).
                const on = (pattern[i] === "x" || pattern[i] === "X") && !exclude.includes(i);
                cell.textContent = on ? "x" : "";
                cell.className = on ? "cell on" : "cell";
              });
            }
          };

          // A drum cell toggles its step's EFFECTIVE state in the
          // current stage's effective tier (the 10b toggleDrum,
          // unchanged): a hit char turns to a rest char; a rest char
          // turns to a hit; a hit forced off by `exclude` turns on by
          // clearing the exclusion (and the reverse — so the toggle
          // always lands on the inverted state, whatever the tier's
          // exclude list says).
          const toggleDrum = (drum, i) => {
            if (!lab.score) return;
            const tiered = lab.score[drum];
            let tier = tierAtOrBelow(tiered, stageNow());
            if (!tier) {
              // Defensive only: Score::from_json validates a stage-0
              // tier, so a valid score always resolves one. The schema
              // still REQUIRES a stage-0 tier — create it (all rest)
              // if a hand-built score somehow lacks one.
              tier = { stage: 0, pattern: ".".repeat(lab.score.steps_per_bar) };
              tiered.tiers.unshift(tier);
            }
            const excluded = (tier.exclude || []).includes(i);
            const hit = tier.pattern[i] === "x" || tier.pattern[i] === "X";
            if (hit && !excluded) {
              // ON -> OFF: clear the hit char.
              tier.pattern = tier.pattern.slice(0, i) + "." + tier.pattern.slice(i + 1);
            } else if (hit) {
              // OFF (the exclusion forces it off) -> ON: clear the
              // exclusion (the char already says hit).
              tier.exclude = (tier.exclude || []).filter((j) => j !== i);
            } else {
              // OFF (rest char) -> ON: set the hit char; drop a
              // redundant exclusion of the same step if one exists.
              tier.pattern = tier.pattern.slice(0, i) + "x" + tier.pattern.slice(i + 1);
              if (excluded) tier.exclude = (tier.exclude || []).filter((j) => j !== i);
            }
            pushScore();
            paintDrums();
          };

          // The harmony lanes (pad/bell/sub): the read-only chord
          // display. The status line has NO bar counter (only
          // stage=), so the live bar's offset is not available
          // client-side: the display shows the stage's chord table
          // (major/minor by the minor window — what each bar's root
          // resolves to as the bars advance) + the slot's engine
          // ratio. There is no editable per-step data for these
          // lanes — the schema has none and the engine ignores it.
          const paintChords = () => {
            if (!lab.score) return;
            const sc = lab.score;
            const stage = stageNow();
            const minor = sc.minor_from <= stage && stage < sc.minor_until;
            const table = minor ? sc.chords.minor : sc.chords.major;
            for (let k = 0; k < 3; k++) {
              const i = 5 + k;
              trackEls[i].lane.textContent =
                "bar chord " + (minor ? "minor" : "major") + " [" + table.join(" ")
                + "] · ratio " + CHORD_RATIO[k].toFixed(2) + " · stage " + stage;
            }
          };

          // The mix state's paint (the critical-correctness half of
          // 11b): the M/S buttons and the rows VISIBLELY reflect the
          // state — a muted row dims (a hidden mute is
          // indistinguishable from a bug when the operator cannot
          // hear the lane), a soloed row highlights — plus the kind
          // selects' and the gains' values re-set to the engine's
          // truth.
          const paintMix = () => {
            if (!lab.score) return;
            for (let i = 0; i < 8; i++) {
              const t = trackEls[i];
              const muted = lab.score.slots[i].muted === true;
              const soloed = lab.score.solo === i;
              t.mBtn.classList.toggle("on-m", muted);
              t.sBtn.classList.toggle("on-s", soloed);
              t.root.classList.toggle("muted", muted);
              t.root.classList.toggle("solo", soloed);
              t.sel.value = lab.score.slots[i].kind || SLOTS_META[i].builtin;
              const g = lab.score.slots[i].gain;
              t.gain.value = String(g);
              t.gainRead.textContent = Number(g).toFixed(2);
            }
          };

          // ---- the JSON row: the bake's read/write surface (10b,
          // unchanged). The box holds the canonical JSON (refreshed
          // from the engine's truth on every sync/paint); Load pushes
          // it back through setScore, so pasting a score and applying
          // it is one click. Download saves it as score.json — the
          // bake that needs no clipboard at all (the reliable path on
          // an insecure origin). Doing the bake = Load/Download then
          // paste-or-save over crates/th-synth/assets/score.json.
          const jsonRow = mk("div", null, "jsonrow");
          const jsonBox = mk("textarea");
          jsonBox.id = "scorelab-json";
          jsonBox.spellcheck = false;
          jsonBox.placeholder = "score json - paste one here and click Load";
          const jsonBtns = mk("div", null, "row");
          const copyBtn = mk("button", "Copy JSON");
          copyBtn.id = "scorelab-copy";
          const dlBtn = mk("button", "Download");
          dlBtn.id = "scorelab-download";
          const loadBtn = mk("button", "Load");
          loadBtn.id = "scorelab-load";
          const fileInput = mk("input");
          fileInput.type = "file";
          fileInput.id = "scorelab-file";
          fileInput.accept = ".json,application/json";

          copyBtn.addEventListener("click", async () => {
            // The bake text: the box's content IS the canonical JSON
            // (refreshed from getScore()); copy the box, not the export,
            // so an unsaved edit in the box is what you get.
            const err = await copyText(jsonBox.value, jsonBox);
            paintScoreStatus(err);
            if (err === "") {
              const old = copyBtn.textContent;
              copyBtn.textContent = "copied";
              setTimeout(() => { copyBtn.textContent = old; }, 900);
            }
          });
          dlBtn.addEventListener("click", () => {
            try {
              const blob = new Blob([jsonBox.value], { type: "application/json" });
              const a = document.createElement("a");
              a.href = URL.createObjectURL(blob);
              a.download = "score.json";
              a.click();
              setTimeout(() => URL.revokeObjectURL(a.href), 1000);
              paintScoreStatus("");
            } catch (err) {
              paintScoreStatus("download: " + (err && err.message ? err.message : String(err)));
            }
          });
          const applyJson = (text) => {
            if (typeof mod.setScore !== "function") {
              paintScoreStatus("setScore export missing (issue 10a not in this build)");
              return;
            }
            const err = mod.setScore(text);
            paintScoreStatus(err);
            if (err !== "") {
              console.error("[scorelab] load rejected: " + err);
            } else {
              // Applied: adopt the engine's truth (it may canonicalise).
              syncFromEngine();
            }
          };
          loadBtn.addEventListener("click", () => applyJson(jsonBox.value));
          // The real "load json" workflow: pick a file off disk.
          fileInput.addEventListener("change", async () => {
            const file = fileInput.files && fileInput.files[0];
            if (!file) return;
            try {
              const text = await file.text();
              jsonBox.value = text;
              applyJson(text);
            } catch (err) {
              paintScoreStatus("read: " + (err && err.message ? err.message : String(err)));
            } finally {
              fileInput.value = ""; // re-picking the same file fires again
            }
          });
          jsonBtns.append(copyBtn, dlBtn, loadBtn, fileInput);
          jsonRow.append(jsonBtns, jsonBox);

          // The full repaint from the engine's truth (the boot sync,
          // the hot-reload sync, and the rejected-push re-sync all
          // land here): the DAW DOM (rebuilt only when the structure
          // changed — steps_per_bar, or a roll's pitch range) + the
          // drum/roll/chord cells + the transport/mix state + the
          // JSON box (mirrors the engine unless the operator is
          // mid-edit in it and it is focused — their text wins until
          // they Load or re-sync).
          lab.paintAll = () => {
            if (!lab.score) return;
            const steps = lab.score.steps_per_bar;
            if (!lab.daw || lab.daw.steps !== steps) {
              lab.daw = { steps, drumCells: buildDrumDom(steps), rolls: {} };
            }
            for (const line of ["bass", "lead"]) {
              const [lo, hi] = pitchRange(line);
              const r = lab.daw.rolls[line];
              if (!r || r.lo !== lo || r.hi !== hi || r.steps !== steps) buildRoll(line);
            }
            paintDrums();
            paintRolls();
            paintChords();
            const set = (ctrl, v) => {
              ctrl.input.value = String(v);
              ctrl.read.textContent = ctrl.fmt(v);
            };
            set(lab.els.bpm, lab.score.bpm.base);
            set(lab.els.gate, lab.score.gate_open);
            set(lab.els.swing, lab.score.swing);
            paintMix();
            if (document.activeElement !== jsonBox) {
              jsonBox.value = mod.getScore ? mod.getScore() : "";
            }
          };

          panel.append(titleEl, transport, tracks, jsonRow);
          document.body.append(panel);

          // The probe's entry (tools/web-tiny-probe.mjs's OH_SCORELAB
          // checks): the same mod.setScore call every edit makes, plus
          // the status paint (a raw export call can't paint the page's
          // UI — the probe's error check asserts the SPAN reflects the
          // error) + the re-sync (a push through this path can change
          // the engine behind the panel's back).
          window.ohSetScore = (json) => {
            const err = mod.setScore(json);
            paintScoreStatus(err);
            syncFromEngine();
            return err;
          };

          // The 1 s poll's hook (assigned here; the poll's tail calls
          // it when non-null): the stage re-read (the drum rack's
          // effective tier + the chord table's major/minor selection
          // are the CURRENT stage's — repaint only on a change) + the
          // first sync (getScore() is "" until the director installs).
          scorelabTick = (s) => {
            const m = /(^|;)stage=(\d+)/.exec(s);
            const st = m ? Number(m[2]) : -1;
            if (st !== lab.stage) {
              lab.stage = st;
              titleEl.textContent = st >= 0 ? "score lab — daw (stage " + st + ")" : "score lab — daw";
              stageRead.textContent = st >= 0 ? "stage " + st : "stage ?";
              paintDrums();
              paintChords();
            }
            if (!lab.score) syncFromEngine();
          };
        }
      }
    </script>
  </body>
</html>
