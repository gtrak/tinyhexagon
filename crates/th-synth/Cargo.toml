[package]
name = "th-synth"
description = "The tiny-runtime soundtrack (plan 002 issue 05): a live `rust-synth` engine (8 pre-allocated tracks) driven by a `MusicDirector` — stage mapping, the `BeatView` for the visuals, collision ducking, the no-device fallback clock, and the web `start_on_gesture` boot. SFX stay in `th-audio`."
version.workspace = true
edition.workspace = true

[dependencies]
# The chiptune score as data (plan 002 issue 10a): the `Score` type's
# serde (de)serialization — `assets/score.json` (the baked default) +
# the lab's live JSON. Workspace pins (serde with `derive`).
serde = { workspace = true }
serde_json = { workspace = true }
# The live modular synth (MIT, `audio` + `math` modules only). 05b: the
# registry crate unconditionally builds its TUI/recording modules, which
# fail on wasm32-unknown-emscripten (crossterm/mio + vorbis's C build);
# it is patched to `vendor/rust-synth-0.23.0` (root `[patch.crates-io]`)
# with `tui`/`recording` behind OFF-by-default features — so this default
# (no-feature) dependency builds the audio-only graph on every target.
# DSP/presets unchanged; see .agents/plans/002-tinyhexagon/05-synth.md.
rust-synth = "0.23.0"

[dev-dependencies]
# The offline_render example builds the SAME fundsp graph the vendored
# engine builds (Preset::build + master_bus are public) — version-matched.
fundsp = "0.20"
