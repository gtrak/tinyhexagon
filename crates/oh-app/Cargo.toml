[package]
name = "oh-app"
description = "The tiny-runtime composition library (D-020): the draw bridge that drives oh_render::graphics::draw_frame from the engine's state — the headless engine composition, the GL draw target, and the platform seams the tiny runtime (plan 002 issue 07) composes over"
version.workspace = true
edition.workspace = true

[dependencies]
# The two sides of the bridge: the engine (never depends on the render
# layer) and the render layer (never depends on the engine). `oh-app` is
# the composition crate that depends on BOTH (DECISIONS.md D-020; D-013:
# oh-game must not gain oh-render — oh-lua depends on oh-game, so the
# adapter cannot live in oh-game or oh-render).
oh-game = { path = "../oh-game" }
oh-render = { path = "../oh-render" }
oh-config = { path = "../oh-config" }
oh-math = { path = "../oh-math" }
oh-data = { path = "../oh-data" }
# The composition (`compose.rs`) implements the `ScriptHost` seam over
# `oh-lua` IN THE LIB: `oh-app -> oh-lua -> oh-game` is acyclic. D-037:
# the Lua VM is Luau — oh-lua's single build; one VM, nothing to split.
oh-lua = { path = "../oh-lua" }
oh-assets = { path = "../oh-assets" }
# 29o1 — the headless / server SIGINT handlers' async-signal-safe stdout
# write (`libc::write` in the signal context; `std`'s `println!` is NOT
# async-signal-safe — it takes the stdout lock, the C++'s `TODO (P2): UB`
# the comment marks for `ssvu::lo` / `std::exit` in the handler). Transitively
# present (signal-hook's dep); a direct dep for the `write(2)` call.
libc = "0.2"
oh-rng = { path = "../oh-rng" }
# The real audio is on EVERY target: the `oh_render::audio::AudioDevice`
# seam picks the backend per target (rodio on desktop/Android, emscripten's
# OpenAL on the web), so `oh-audio` is a COMMON dep. Its `rodio` OGG decode
# (symphonia, pure Rust) is what the web's one-shot / music decode use;
# `rodio`/`cpal`'s device sink itself only compiles to a usable sink on
# desktop/Android (the web's sink is the OpenAL backend in `oh-render`).
oh-audio = { path = "../oh-audio" }

# SIGINT is a desktop / headless concern: the web loop is a plain
# `request_animation_frame` (no signal handler).
[target.'cfg(not(target_os = "emscripten"))'.dependencies]
# C++ main.cpp:340-349 — the SIGINT handler, the SAFE port (the C++'s
# `TODO (P2): UB`, main.cpp:339: the C++ handler called
# `globalWindow.stop()` — non-atomic engine state — inside the signal
# context). `signal-hook`'s `flag::register` / `low_level::register`
# keep the signal context to a single atomic store / one `write(2)`.
signal-hook = "0.3"

[target.'cfg(not(any(target_os = "android", target_family = "wasm")))'.dependencies]
# The desktop controller backend behind `RealJoystick`
# (`src/joystick.rs`): the C++ `sf::Joystick` controller-0 poll's
# replacement (the SFML read in `Core/Joystick.cpp::update`). Desktop
# only — the Android / wasm targets keep the no-op `NoJoystick`
# seam (the C++'s `isConnected(0) == false` state).
# SYSTEM REQUIREMENT (Linux): the `libudev` system library (the
# transitive `libudev-sys` build links it — `libudev-dev` at build
# time; `.github/workflows/rust.yml`'s portability notes), and at
# runtime hidraw device access for non-root users (the udev rule —
# gilrs ships `60-gilrs.rules`). A failed open degrades to the
# no-controller state (logged once), the C++ SFML no-pad behavior.
gilrs = "0.11"

[target.'cfg(target_os = "emscripten")'.dependencies]
# The web's `#fs` click / change-sink install (`src/web_fullscreen.rs`,
# salvaged from `oh-additions` by plan 002 issue 02a): the browser
# Fullscreen API over the `documentElement` — `Window` (the
# `web_sys::window()` + `document()` read) + `Document` (the
# `fullscreenElement` / `documentElement` / `exitFullscreen` + the
# `fullscreenEnabled` read) + `Element` (the `documentElement`'s
# `requestFullscreen`) + `Event` (the transition-edge DOM signal the
# web entry's listener rides, Issue 08).
web-sys = { version = "0.3.106", features = [
  "Window",
  "Document",
  "Element",
  "Event",
] }
