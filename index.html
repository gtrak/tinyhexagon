<!doctype html>
<!--
  th-web (plan 002 issue 03c) — the STUB page: the minimal shell the
  stub wasm (th-web's `#[wasm_bindgen] status()` / `save_session()`
  exports, issue 03c) executes against. The adult W5 shell (the IDBFS
  persistence / fullscreen / IME glue) is retired with the entry
  (issue 02a); issue 08 replaces this page with the real tiny entry's
  shell (re-adding the fullscreen / IME / audio-unlock wiring there).

  SERVE (static, no build step): the THREE build artifacts (the loader
  `tinyhexagon.js` — MODULARIZE + EXPORT_ES6, the factory default-
  export — + `tinyhexagon.wasm` + the preloaded `tinyhexagon.data`)
  live BESIDE this file (tools/package-web.sh's serve dir stages them);
  serve this directory:

      python3 -m http.server 8080 --directory <this directory>

  URL: http://127.0.0.1:8080/
  (Any static file server works — the page is plain ES module + three
  files. The `.data` is the `--preload-file=_RELEASE@/RELEASE` package;
  tools/web-stub-probe.mjs waits on the MODULE RESOLVE (default 60 s),
  not the page load — the 22 MB preload fetches during the factory's
  boot.)

  Expected browser console:
      status tinyhexagon stub: the tiny runtime lands in plan 002 issue 07/08   (every 1 s)
  The canvas stays BLACK until the runtime lands (07/08) — it is the
  probe's "a canvas with non-zero width/height" assertion's target,
  not the game's window.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>tinyhexagon</title>
    <style>
      html, body { margin: 0; padding: 0; background: #111; color: #ddd;
                   font-family: monospace; overflow: hidden; }
      /* Full-viewport: the stub draws nothing (the runtime is 07/08);
         the non-zero size is the probe's canvas assertion's target. */
      canvas { display: block; width: 100vw; height: 100vh; }
      #status { position: fixed; top: 4px; right: 8px; font-size: 11px;
                opacity: 0.7; }
    </style>
  </head>
  <body>
    <!-- The initial backing store only: the stub never resizes it
         (the emscripten window's real-size measurement lands with the
         runtime, 07/08). -->
    <canvas id="c" width="640" height="480"></canvas>
    <!-- Starts EMPTY: the probe's wait is `#status` leaving empty (the
         poll below fills it within 1 s of the module's resolve). -->
    <div id="status"></div>
    <script type="module">
      // MODULARIZE + EXPORT_ES6 (the 26c.1 recipe): the default export
      // is the Module factory; it resolves once the wasm (the stub's
      // `main`, registered through wasm-bindgen's addOnInit) has
      // initialized — the resolve IS the boot (the probe's wait).
      import Module from "./tinyhexagon.js";
      const mod = await Module();
      // The probe hook (tools/web-stub-probe.mjs's `window.ohStatus` —
      // the module scope's `mod` is not a global, so the page exposes
      // the `#[wasm_bindgen]` export on `window`).
      window.ohStatus = () => mod.status();
      setInterval(() => {
        const s = mod.status();
        document.getElementById("status").textContent = s;
        console.log("status " + s);
      }, 1000);
    </script>
  </body>
</html>
