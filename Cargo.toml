[workspace]
resolver = "2"
members = [
    "crates/th-math",
    "crates/th-rng",
    "crates/th-data",
    "crates/th-config",
    "crates/th-lua",
    "crates/th-assets",
    "crates/th-game",
    "crates/th-audio",
    "crates/th-synth",
    "crates/th-render",
    "crates/th-app",
    "crates/th-android",
    "crates/th-web",
]
# The default member: `cargo run` / bare `cargo build` at the repo root
# target the `tinyhexagon` stub binary (the th-app bin — plan 002 issue 03;
# the real tiny runtime replaces the stub in issue 07).
default-members = ["crates/th-app"]
# Later issues add workspace members as they land (PLAN.md architecture
# table): th-synth (plan 002 issue 05). (The Discord crate was removed by
# plan 002 issue 02c1; the replay crate was removed by issue 02c2.)

[workspace.package]
version = "0.1.0"
edition = "2021"

# Pinned for later issues (issues 03+: serde, serde_json, thiserror).
# Resolved workspace-wide; harmless while unused. (The flate2 + tempfile
# pins were the replay crate's (issue 02) and left with it — plan 002
# issue 02c2.)
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Plan 002 issue 05a (th-synth): `rust-synth 0.23` pulls cpal 0.15 -> alsa
# 0.9 -> alsa-sys ^0.3.1, while rodio 0.23 (th-render/th-audio) pulls cpal
# 0.18 -> alsa 0.11 -> alsa-sys 0.4.0. Both alsa-sys crates declare
# `links = "alsa"`, so Cargo refuses the graph. The vendored 0.3.1
# (`vendor/alsa-sys-0.3.1`, byte-identical to the registry source with
# `links = "alsa_0_3"`) patches the 0.3.x line only; the 0.4.0 registry
# crate keeps `links = "alsa"`. See .agents/plans/002-tinyhexagon/05-synth.md.
[patch.crates-io]
alsa-sys = { path = "vendor/alsa-sys-0.3.1", version = "0.3.1" }

# Profile tuning is finalized by issue 22 (builds/CI); issue 24 pins the
# release profile to the C++ release build's settings.
#
# The C++ release build's flags (D-014, cited):
#   * The build type is `RELEASE` everywhere the release intent is expressed:
#     `.github/workflows/ci_linux.yml` (`cmake -GNinja -DCMAKE_BUILD_TYPE=RELEASE`)
#     and `build.sh --mingw-release` (`build.sh:66-67` → `-DCMAKE_BUILD_TYPE=RELEASE`,
#     `build.sh:118`). CMake's GNU-compiler module then sets the release flags
#     to exactly `-O3 -DNDEBUG` (CMake Modules/Compiler/GNU.cmake:61 `-O3`,
#     :65 `-DNDEBUG`) — no custom optimization flags: `CMakeLists.txt:347-348`
#     leaves the common-compiler-flags call commented out ("TODO: decide how
#     to handle flags") and the whole LTO block is commented out
#     (`CMakeLists.txt:353-366`, "C++ had LTO commented out" — 24-packaging.md
#     step 1).
# The Rust mirror (and the deliberate non-mirrors):
#   * `-O3`       -> `opt-level = 3` (the Rust release default, now spelled out)
#   * `-DNDEBUG`  -> `debug-assertions = false` (the Rust release default,
#                    spelled out: `debug_assert!` off, mirroring disabled
#                    C++ `assert()`)
#   * LTO OFF     -> NO `lto` here. LTO changes the codegen pipeline the float
#                    math is verified on: the th-game determinism harness and
#                    the whole release test suite are test-verified on the
#                    default release profile (D-000: arithmetic-exact port —
#                    float evaluation must stay identical to the verified
#                    default). The C++ build does not enable LTO either
#     (CMakeLists.txt:353-366), so keeping it OFF is also the faithful mirror.
#   * NO `strip` / `codegen-units` / `panic` overrides: the C++ release build
#     sets none of them, and they are not part of the test-verified baseline.
[profile.release]
opt-level = 3
debug-assertions = false

